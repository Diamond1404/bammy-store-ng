<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | BAMMY STORE NG</title><link rel="stylesheet" href="admin.css"></head>
<body><div class="layout"><aside class="sidebar"><a class="brand" href="../index.html"><span class="brand-mark">B</span><span>BAMMY STORE NG<small>OWNER PANEL</small></span></a><nav id="nav"><button data-view="overview" class="active">Overview</button><button data-view="products">Products & stock</button><button data-view="orders">Orders</button><button data-view="payments">Payments</button><button data-view="customers">Customers</button><button data-view="reports">Reports</button><button data-view="promotions">Promotions</button></nav><button id="logout" class="logout">Sign out</button></aside><main class="main"><header class="top"><div><p class="eyebrow">STORE MANAGEMENT</p><h1 id="heading">Overview</h1></div><span id="owner" class="owner"></span></header><section id="content"><p>Loading your store data…</p></section></main></div><dialog id="productDialog"><form id="productForm" enctype="multipart/form-data"><div class="dialog-head"><h2 id="productTitle">Add product</h2><button type="button" class="close" id="closeDialog">×</button></div><input type="hidden" name="id"><label>Product name<input name="name" required></label><label>Category<select name="category" required><option>Kitchen & Home</option><option>Women's Footwear</option><option>Women's Bags</option><option>Perfumes</option><option>Jewellery</option><option>Wristwatches</option></select></label><div class="two"><label>Price (₦)<input name="price" type="number" min="0" step="1" required></label><label>Stock quantity<input name="stock" type="number" min="0" step="1" required></label></div><label>Short description<textarea name="description" rows="3"></textarea></label><label>Product image<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Badge / tag<input name="tag" placeholder="New arrival"></label><label class="check"><input name="active" type="checkbox" checked> Visible in store</label><button class="primary">Save product</button><p id="productMessage" class="message"></p></form></dialog><script src="admin.js"></script></body></html>
